<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>

<script src="../../_ds_bundle.js"></script>
<script src="../../ds-resolve.js"></script>
<style>body{padding:16px}.pane{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:10px;background:var(--background);color:var(--foreground);box-shadow:0 0 0 0.5px var(--border)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.DS;
const { SidebarItem, SidebarSection, Breadcrumbs, Menu } = DS;
const Demo = () => <>
  <Breadcrumbs items={[{label:'acme-media',icon:'database'},{label:'projects'},{label:'2026'}]}/>
  <div style={{display:'flex',gap:10}}>
    <div style={{width:150,background:'var(--sidebar)',borderRadius:8,paddingBottom:8,margin:'0 -6px'}}><SidebarSection title="ドライブ"><SidebarItem icon="hard-drive" label="すべて" active/><SidebarItem icon="clock" label="最近" /><SidebarItem icon="database" label="acme-backup" count={3}/></SidebarSection></div>
    <Menu style={{minWidth:0,flex:1}} items={[{label:'ダウンロード',icon:'download',shortcut:'⌘D'},{label:'移動…',icon:'folder-input'},{label:'クラス変更…',icon:'layers'},{separator:true},{label:'削除',icon:'trash-2',destructive:true,shortcut:'⌘⌫'}]}/>
  </div>
</>;
const Pane = ({theme, children}) => <div data-theme={theme} className="pane" style={{flex:1,minWidth:0}}>{children}</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'flex',gap:12}}><Pane theme="light"><Demo/></Pane><Pane theme="dark"><Demo/></Pane></div>);
</script></body></html>
