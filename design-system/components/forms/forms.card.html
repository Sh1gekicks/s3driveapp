<!-- @dsCard group="Components" viewport="700x330" name="Form controls" subtitle="Input · Select · Checkbox · Switch · SegmentedControl" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../ds-resolve.js"></script>
<style>body{padding:16px}.pane{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:10px;background:var(--background);color:var(--foreground);box-shadow:0 0 0 0.5px var(--border)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.DS;
const { Input, Select, Checkbox, Switch, SegmentedControl } = DS;
const Demo = () => { const [s,setS]=React.useState(true); const [c,setC]=React.useState(true); const [v,setV]=React.useState('list');
 return <>
  <Input icon="search" placeholder="名前・拡張子で検索"/>
  <Input label="バケット名" defaultValue="acme-media-tokyo"/>
  <Input label="シークレットキー" type="password" defaultValue="xxxxxxxx" invalid hint="認証に失敗しました"/>
  <Select label="リージョン" options={[{value:'ap-northeast-1',label:'アジアパシフィック (東京)'},{value:'us-east-1',label:'米国東部 (バージニア北部)'}]}/>
  <div className="row" style={{justifyContent:'space-between'}}><Checkbox checked={c} onChange={setC} label="古いバージョンも削除"/><SegmentedControl value={v} onChange={setV} options={[{value:'list',label:'リスト',icon:'list',iconOnly:true},{value:'grid',label:'グリッド',icon:'layout-grid',iconOnly:true}]}/></div>
  <Switch checked={s} onChange={setS} label="バージョニング"/>
 </>; };
const Pane = ({theme, children}) => <div data-theme={theme} className="pane" style={{flex:1,minWidth:0}}>{children}</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'flex',gap:12}}><Pane theme="light"><Demo/></Pane><Pane theme="dark"><Demo/></Pane></div>);
</script></body></html>
