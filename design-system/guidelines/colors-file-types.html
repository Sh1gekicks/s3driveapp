<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;min-height:100vh;box-sizing:border-box}.lbl{font-size:11px;color:var(--muted-foreground)}.tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-folder)"></div><div class="tok">--ft-folder</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-image)"></div><div class="tok">--ft-image</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-video)"></div><div class="tok">--ft-video</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-audio)"></div><div class="tok">--ft-audio</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-pdf)"></div><div class="tok">--ft-pdf</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-sheet)"></div><div class="tok">--ft-sheet</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-archive)"></div><div class="tok">--ft-archive</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-code)"></div><div class="tok">--ft-code</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border-radius:6px;background:var(--ft-doc)"></div><div class="tok">--ft-doc</div></div></div>
</body></html>
