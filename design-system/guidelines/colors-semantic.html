<!-- @dsCard group="Colors" viewport="700x120" subtitle="Status colors; text uses color-mix toward foreground" name="Semantic" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;min-height:100vh;box-sizing:border-box}.lbl{font-size:11px;color:var(--muted-foreground)}.tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:6px;background:var(--primary)"></div><div style="display:inline-flex;align-self:flex-start;height:18px;align-items:center;padding:0 6px;border-radius:5px;font-size:11px;font-weight:500;background:color-mix(in oklch,var(--primary) 14%,transparent);color:color-mix(in oklch,var(--primary) 70%,var(--foreground))">プライマリ</div><div class="tok">--primary</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:6px;background:var(--destructive)"></div><div style="display:inline-flex;align-self:flex-start;height:18px;align-items:center;padding:0 6px;border-radius:5px;font-size:11px;font-weight:500;background:color-mix(in oklch,var(--destructive) 14%,transparent);color:color-mix(in oklch,var(--destructive) 70%,var(--foreground))">削除・エラー</div><div class="tok">--destructive</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:6px;background:var(--success)"></div><div style="display:inline-flex;align-self:flex-start;height:18px;align-items:center;padding:0 6px;border-radius:5px;font-size:11px;font-weight:500;background:color-mix(in oklch,var(--success) 14%,transparent);color:color-mix(in oklch,var(--success) 70%,var(--foreground))">完了</div><div class="tok">--success</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:6px;background:var(--warning)"></div><div style="display:inline-flex;align-self:flex-start;height:18px;align-items:center;padding:0 6px;border-radius:5px;font-size:11px;font-weight:500;background:color-mix(in oklch,var(--warning) 14%,transparent);color:color-mix(in oklch,var(--warning) 70%,var(--foreground))">注意</div><div class="tok">--warning</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:6px;background:var(--info)"></div><div style="display:inline-flex;align-self:flex-start;height:18px;align-items:center;padding:0 6px;border-radius:5px;font-size:11px;font-weight:500;background:color-mix(in oklch,var(--info) 14%,transparent);color:color-mix(in oklch,var(--info) 70%,var(--foreground))">情報</div><div class="tok">--info</div></div></div>
</body></html>
