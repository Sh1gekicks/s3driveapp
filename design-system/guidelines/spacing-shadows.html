<!-- @dsCard group="Spacing" viewport="700x140" subtitle="0.5px ヘアライン + 柔らかいドロップ" name="Elevation" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:12px;min-height:100vh;box-sizing:border-box}.lbl{font-size:11px;color:var(--muted-foreground)}.tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}</style></head><body>
<div style="display:flex;gap:12px"><div data-theme="light" style="flex:1;padding:22px;background:var(--background);border-radius:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-xs)"></div><div class="tok" style="margin-top:8px">--shadow-xs</div></div><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-sm)"></div><div class="tok" style="margin-top:8px">--shadow-sm</div></div><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-md)"></div><div class="tok" style="margin-top:8px">--shadow-md</div></div><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-lg)"></div><div class="tok" style="margin-top:8px">--shadow-lg</div></div></div><div data-theme="dark" style="flex:1;padding:22px;background:var(--background);border-radius:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-xs)"></div><div class="tok" style="margin-top:8px">--shadow-xs</div></div><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-sm)"></div><div class="tok" style="margin-top:8px">--shadow-sm</div></div><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-md)"></div><div class="tok" style="margin-top:8px">--shadow-md</div></div><div><div style="height:48px;border-radius:8px;background:var(--card);box-shadow:var(--shadow-lg)"></div><div class="tok" style="margin-top:8px">--shadow-lg</div></div></div></div>
</body></html>
