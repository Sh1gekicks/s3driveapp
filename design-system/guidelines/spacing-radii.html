<!-- @dsCard group="Spacing" viewport="700x130" subtitle="小さく控えめ — ネイティブ macOS 相当" name="Corner radii" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;min-height:100vh;box-sizing:border-box}.lbl{font-size:11px;color:var(--muted-foreground)}.tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:4px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)"></div><div style="font-size:11px">チェックボックス</div><div class="tok">--radius-xs · 4px</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:5px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)"></div><div style="font-size:11px">バッジ・小ボタン</div><div class="tok">--radius-sm · 5px</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:6px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)"></div><div style="font-size:11px">ボタン・入力</div><div class="tok">--radius-md · 6px</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:8px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)"></div><div style="font-size:11px">メニュー・行選択</div><div class="tok">--radius-lg · 8px</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:10px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)"></div><div style="font-size:11px">トースト</div><div class="tok">--radius-xl · 10px</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:12px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)"></div><div style="font-size:11px">ダイアログ・ウィンドウ</div><div class="tok">--radius-2xl · 12px</div></div></div>
</body></html>
