[workspace]
resolver = "3"
members = ["crates/s3drive-core", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Sh1gekicks/s3driveapp"

[workspace.dependencies]
s3drive-core = { path = "crates/s3drive-core" }

# 非同期
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = "0.7"
futures = "0.3"

# AWS SDK for Rust（REQ-T01）
# 既定の "rustls" 機能は旧 hyper 0.14／rustls 0.21 の接続（RustSec の勧告あり）を含めるため外し、
# 既定の HTTPS クライアント（hyper 1／rustls 0.23）だけを使う（deny.toml）
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.150", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.118", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-cloudwatch = { version = "1.133", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-costexplorer = { version = "1.131", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-pricing = { version = "1.117", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "1.3"
aws-smithy-types = "1.8"
aws-smithy-runtime-api = "1"
aws-types = "1"

# 永続化
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite_migration = "2.6"

# シリアライズ・型共有
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

# その他
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
unicode-normalization = "0.1"
walkdir = "2"
filetime = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
