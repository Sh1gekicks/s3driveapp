[package]
name = "s3drive-app"
version = "0.1.0"
description = "S3 Drive（macOS アプリ本体）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "s3drive_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# E2E テスト用ビルド（WebDriver サーバーを内蔵し、Google サインインを固定のセッションにする。09 §2.5）
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
s3drive-core.workspace = true
# npm の @tauri-apps/api・@tauri-apps/cli と同じマイナー版にそろえる（Tauri の CLI は不一致をエラーにする）。
# 更新するときは npm 側と同時に上げる（Renovate のグループで扱う）
tauri = { version = "~2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "~2.9"
# 既定の "zip" 機能は外す。Windows 向けの旧形式（Tauri v1 の .zip）の更新ファイルを展開するためのもので、
# macOS の更新（.app.tar.gz）には使わない。有効にすると、勧告のある zip 4 系が Cargo.lock に入る
# （修正版は zip 9.0.5 以降。2026-11 時点の最新の tauri-plugin-updater 2.12.0 は zip 4 を要求する）
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "~2.3"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
