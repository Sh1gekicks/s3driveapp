# cargo deny の設定（07 §7、08 §3 の audit ジョブ）。
# 実行: cargo deny check

[graph]
# リリースするのは macOS のみ。Windows／Linux 専用の依存は検査の対象外にする
#
# 対象外にしている既知の勧告（Cargo.lock には含まれるため、GitHub の Dependabot では通知される）:
# - RUSTSEC-2024-0429／GHSA-wrw7-89jp-8q8g（glib 0.18 の VariantStrIter の不健全性）
#   glib 0.18 は Tauri の Linux 向けの GTK／WebKitGTK が使うもので、macOS のビルドには含まれない。
#   該当する VariantStrIter（array_iter_str）を呼ぶ依存も、このアプリのコードもない。
#   修正版（glib 0.20 以降）へは、Tauri・wry・webkit2gtk が gtk 0.18 を使い続けている間は更新できない
#   （2026-09 時点の最新: tauri 2.12.0、wry 0.57.0、webkit2gtk 2.0.2）
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
# RustSec の勧告。例外にするときは ID と理由を書く
ignore = [
  # rsa（openidconnect 経由）の Marvin Attack。修正版は未公開。影響するのは秘密鍵での復号・署名の処理時間だが、
  # このアプリは Google の ID トークンの署名を公開鍵で検証するだけで、秘密鍵の操作を行わない
  { id = "RUSTSEC-2023-0071", reason = "rsa は公開鍵による署名検証のみに使い、秘密鍵の操作がないため影響しない" },
  # crypto-bigint 0.5 の定数時間でない演算（タイミングのサイドチャネル）。修正版は 0.7.6 以降だが、
  # 依存元の aws-sigv4（sigv4a 機能）と elliptic-curve 0.13（openidconnect の p256／p384 経由）が 0.5 のため更新できない
  # （2026-10 時点の最新: aws-sigv4 1.6.3、openidconnect 4.0.1）。
  # openidconnect は ID トークンの署名を公開鍵で検証するだけで、秘密の値を扱わない。
  # aws-sigv4 はシークレットキーからの SigV4a の鍵の導出に使うが、SigV4a はマルチリージョンアクセスポイントへの
  # 要求でだけ使われ、悪用には利用者の Mac 上で処理時間を観測する必要がある。
  # aws-sigv4 と openidconnect が crypto-bigint 0.7 に移ったら更新し、この例外を外す
  { id = "RUSTSEC-2026-0387", reason = "秘密の値に関わるのは SigV4a の鍵の導出だけで、悪用には利用者の端末上での観測が必要なため。修正版を使う aws-sigv4・openidconnect の公開を待つ" },
]

[licenses]
# 配布物に含めてよいライセンス（いずれも寛容なライセンス）
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "BlueOak-1.0.0",
  # 弱いコピーレフト（ファイル単位）。改変せずに利用するため配布上の義務は告知のみ
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# 同じクレートの複数バージョンは AWS SDK・Tauri の依存で避けられないため警告にとどめる
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
